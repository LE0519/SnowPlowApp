name: Build iOS app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create the Xcode project
        run: xcodegen generate

      - name: Build the app (unsigned)
        run: |
          xcodebuild \
            -project SnowPlowApp.xcodeproj \
            -scheme SnowPlowApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package the .ipa file
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SnowPlowApp.app Payload/
          zip -r SnowPlowApp.ipa Payload

      - name: Save the .ipa so you can download it
        uses: actions/upload-artifact@v4
        with:
          name: SnowPlowApp-ipa
          path: SnowPlowApp.ipa
