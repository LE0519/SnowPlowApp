name: SnowPlowApp
options:
  bundleIdPrefix: com.snowplowapp
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.19.3
targets:
  SnowPlowApp:
    type: application
    platform: iOS
    sources:
      - SnowPlowApp
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: SnowPlow
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: "SnowPlow uses your location to notice when you arrive at a customer's property and mark the job done. Your location stays on this phone."
        NSLocationAlwaysAndWhenInUseUsageDescription: "SnowPlow uses your location, even when the app is in the background or the phone is locked, to notice when you arrive at a customer's property and mark the job done. Your location stays on this phone."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snowplowapp.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
