name: SnowPlowApp
options:
  bundleIdPrefix: com.snowplowapp
  deploymentTarget:
    iOS: "17.0"
targets:
  SnowPlowApp:
    type: application
    platform: iOS
    sources:
      - SnowPlowApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snowplowapp.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: SnowPlow
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
